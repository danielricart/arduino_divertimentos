name: Build midi-experiments

on:
  pull_request:
    paths:
      - "midi-experiments/**"
      - ".github/workflows/midi-experiments-build.yml"
  push:
    paths:
      - "midi-experiments/**"
      - ".github/workflows/midi-experiments-build.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:nologo_esp32c3_super_mini
          sketch-paths: |
            - midi-experiments/ble_midi_knob
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          # BLE-MIDI comes from GitHub master: the 2.2 release does not compile on esp32 core 3.x.
          libraries: |
            - source-url: https://github.com/lathoub/Arduino-BLE-MIDI.git
              name: BLE-MIDI
            - name: MIDI Library
            - name: Arduino_Modulino
