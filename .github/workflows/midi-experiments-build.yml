name: Build midi-experiments

on:
  pull_request:
    paths:
      - "midi-experiments/**"
      - ".github/workflows/midi-experiments-build.yml"
  push:
    paths:
      - "midi-experiments/**"
      - ".github/workflows/midi-experiments-build.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:nologo_esp32c3_super_mini
          sketch-paths: |
            - midi-experiments/ble_midi_knob
          platforms: |
            - name: esp32:esp32
              version: "3.3.12"
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          # NimBLE must be pinned to 1.4.3 because BLE-MIDI is not compatible with 2.x.
          # It is installed last because installing BLE-MIDI pulls the newest NimBLE as a
          # dependency and would otherwise replace the pin.
          libraries: |
            - name: BLE-MIDI
              version: "2.2"
            - name: Arduino_Modulino
            - name: NimBLE-Arduino
              version: "1.4.3"
